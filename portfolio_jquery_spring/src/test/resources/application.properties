# 테스트 공통 오버레이. (application.yml 이 아니라 .properties 인 이유: 테스트 클래스패스의
# application.yml 은 메인 application.yml 을 통째로 가리지만, .properties 는 함께 로드되어
# 키 단위로만 덮는다 - 오버레이에는 이쪽이 안전하다.)
#
# 릴레이 데모 표본 시더를 끈다 - @SpringBootTest 컨텍스트마다 ApplicationReadyEvent 로
# 표본 6건이 들어가 워커가 배경에서 돌면 무관한 테스트의 시간·로그에 소음이 된다.
# 파이프라인 자체 검증(RelayPipelineFlowTest)은 자기 표본을 직접 예약한다.
app.relay.seed.enabled=false
