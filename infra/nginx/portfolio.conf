# 포트폴리오 통합 서버 nginx 설정 - 한 EC2 에서 인트로 + 데모 다섯을 함께 서빙한다.
#
# IP 리터럴 접속(도메인 없음)이라 TLS 핸드셰이크에 SNI 가 없다 -> 서브도메인을 쓸 수 없고,
# 앱들이 모두 `/api/*` 를 써 경로로도 나눌 수 없다(경로로 나누려면 앱마다 basePath 개조가 필요).
# 그래서 **포트로** 나눈다. 각 포트의 default_server 가 같은 IP 인증서 한 장을 공유한다.
#
#   https://<ip>/       -> 인트로 랜딩(정적)            /var/www/intro
#   https://<ip>:8443/  -> JC Guard  (Spring, 파일차단 + IP 접근제어)  127.0.0.1:8080
#   https://<ip>:9443/  -> JC Chat   (Next)             127.0.0.1:3000
#   https://<ip>:9444/  -> JC DocuQA (Next)             127.0.0.1:3030
#   https://<ip>:9445/  -> JC Exchange (Next)           127.0.0.1:3010
#   https://<ip>:9446/  -> JC LoanDoc (FastAPI)         127.0.0.1:8000
#   http://<ip>/        -> /.well-known/acme-challenge/ 만 서빙하고 나머지는 443 으로 301
#
# 보안그룹(인바운드)에 80, 443, 8443, 9443-9446 을 열어야 한다.
#
# 배치: 이 파일을 /etc/nginx/sites-available/portfolio 로, snippets/ 두 개를
#       /etc/nginx/snippets/portfolio-*.conf 로 두고(provision.sh 가 한다)
#       `sudo nginx -t && sudo systemctl reload nginx`.
# 인증서 발급/6일 갱신은 infra/issue-cert-ip.sh 가 담당한다(IP http-01, 발급 후 이 설정으로 교체).
# HTTP/2 는 `listen ... ssl http2` 로 켠다. 이 형태는 nginx 1.24(우분투 24.04 기본)에서 유일하게 동작하고,
# 1.25.1+ 에서는 deprecated 경고만 내고 그대로 동작한다 - 두 버전 모두에서 안전한 유일한 표기다.
# 반대로 1.25.1+ 전용 지시자를 쓰면 1.24 에서는 unknown directive 로 nginx 가 아예 뜨지 않는다(실제로 겪음).

# ── 공통: ACME 갱신 + HTTP -> HTTPS (포트 80) ──────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME(http-01) 갱신용. 리다이렉트보다 반드시 "위" 에 둔다 - 이 블록을 덮으면 갱신이 죽고
    # 6일 뒤 인증서가 만료돼 다섯 데모가 동시에 내려간다. IP 인증서 갱신의 생명선.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;              # setup-tls-ip.sh 의 WEBROOT 와 반드시 일치시킬 것
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 인트로 랜딩 (443) : 정적 HTML 한 장 ───────────────────────────────────
# 방문자가 IP 로 그냥 들어오면 여기가 첫 화면이다. 각 데모로 가는 링크는 인트로의 스크립트가
# "지금 페이지의 호스트 + 데모별 포트" 로 조립한다 - 그래서 IP 가 바뀌어도 고칠 곳이 없다.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    include snippets/portfolio-tls-ip.conf;

    root /var/www/intro;
    index index.html;
    limit_conn portfolio_conn 40;

    # 데모는 앱이 자기 헤더를 붙이지만 인트로는 nginx 가 파일을 그대로 내보낸다 - 여기서 붙인다.
    include snippets/portfolio-static-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 닷파일 차단. 여기서만 파일시스템을 직접 서빙하므로(다른 블록은 전부 프록시), .git/.env
    # 같은 것이 웹루트에 섞여 들어가는 사고는 이 블록에서만 의미가 있다. 80 포트의 ACME
    # 경로(`^~ /.well-known/...`)는 다른 server 블록이고 접두 매치라 영향이 없다.
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # 진입 문서는 캐시하지 않는다 - 데모 링크/문구를 고치면 즉시 반영돼야 한다.
    location = /index.html {
        add_header Cache-Control "no-store";
        include snippets/portfolio-static-headers.conf;  # 상위 add_header 가 사라지므로 다시
    }

    # 이미지는 저장하되 매번 재검증한다(no-cache). 304 는 본문이 0바이트라 사실상 공짜인데,
    # max-age 를 걸면 스크린샷을 교체해도 그 시간만큼 옛 것이 보인다 - 스크린샷은 이 페이지의
    # 내용 그 자체라 낡은 쪽이 훨씬 비싸다(도메인 설정과 동일한 판단).
    location ~* \.(jpg|jpeg|png|webp|svg|ico)$ {
        add_header Cache-Control "no-cache";
        include snippets/portfolio-static-headers.conf;  # 상위 add_header 가 사라지므로 다시
        try_files $uri =404;
    }

    # 없는 경로는 404 로 끝낸다. 마지막 인자를 /index.html 로 두는 것은 SPA 관용구인데 이
    # 페이지에는 클라이언트 라우터가 없다. 그대로 두면 오타 난 경로가 200 + 랜딩 HTML 로
    # 응답해서, 화면에는 깨진 이미지가 뜨는데 로그에는 성공만 남는다(도메인 설정도 동일).
    location / {
        try_files $uri $uri/ =404;
    }
}

# ── JC Guard (8443) : Spring Boot (jQuery UI + REST) ──────────────────────
server {
    listen 8443 ssl http2 default_server;
    listen [::]:8443 ssl http2 default_server;
    server_name _;
    include snippets/portfolio-tls-ip.conf;
    include snippets/portfolio-robots-disallow.conf;   # 앱은 색인 대상이 아니다
    include snippets/portfolio-guard-html.conf;   # 진입 HTML 은 캐시하지 않는다

    client_max_body_size 10m;            # 파일 검증 데모(멀티파트 5MB + 여유)
    limit_conn portfolio_conn 40;

    # 심층 방어: 운영 도구 표면을 엣지에서도 닫는다. 앱단에서 이미 prod 는 actuator 를
    # health/info 로 제한하고 springdoc 을 끄지만, 설정 한 줄 실수로 열리는 표면이라 이중으로 막는다.
    # 배포 헬스 게이트는 서버 안에서 127.0.0.1:8080 을 직접 치므로 이 차단에 걸리지 않는다.
    location ~ ^/(actuator|swagger-ui|v3/api-docs|h2-console) {
        deny all;
        access_log off;
    }

    # 업로드는 CPU(Tika 파싱)와 디스크(격리 저장)를 함께 먹는 유일한 경로다. 별도 존으로 더 조인다.
    location /api/files {
        limit_req zone=portfolio_upload burst=10 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_backend;
    }

    location /api/ {
        limit_req zone=portfolio_api burst=20 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_backend;
    }

    location / {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_backend;
    }
}

# ── JC Chat (9443) : Next.js ──────────────────────────────────────────────
server {
    listen 9443 ssl http2;
    listen [::]:9443 ssl http2;
    server_name _;
    include snippets/portfolio-tls-ip.conf;
    include snippets/portfolio-robots-disallow.conf;   # 앱은 색인 대상이 아니다

    client_max_body_size 5m;             # 프론트는 큰 업로드가 없다
    limit_conn portfolio_conn 40;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 해시 파일명 정적 자산은 영구 캐시(불변). 앱 진입 문서는 프록시 기본(no-store 성향)으로 최신 배포 반영.
    location /_next/static/ {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_chat;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SSE(/api/reply): 프록시 버퍼링을 끈다. 라우트가 X-Accel-Buffering:no 를 주지만 이중 보장.
    # 응답이 120초까지 열려 있는 비싼 엔드포인트라 rate limit 을 함께 건다.
    location = /api/reply {
        limit_req zone=portfolio_api burst=10 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_chat;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=portfolio_api burst=20 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_chat;
    }

    location / {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_chat;
    }
}

# ── JC DocuQA (9444) : Next.js ────────────────────────────────────────────
server {
    listen 9444 ssl http2;
    listen [::]:9444 ssl http2;
    server_name _;
    include snippets/portfolio-tls-ip.conf;
    include snippets/portfolio-robots-disallow.conf;   # 앱은 색인 대상이 아니다

    client_max_body_size 5m;
    limit_conn portfolio_conn 40;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /_next/static/ {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_docqa;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SSE(/api/answer) - 근거 QA 의 답변 스트리밍. 버퍼링되면 한 번에 쏟아져 스트리밍이 죽는다.
    location = /api/answer {
        limit_req zone=portfolio_api burst=10 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_docqa;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=portfolio_api burst=20 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_docqa;
    }

    location / {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_docqa;
    }
}

