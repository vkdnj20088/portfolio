# ── JC LoanDoc (9446) : Python/FastAPI ────────────────────────────────────
# 도메인 설정(portfolio-domain.conf)의 loandoc 블록과 같은 정책 - 근거 주석은 그쪽에.
server {
    listen 9446 ssl http2;
    listen [::]:9446 ssl http2;
    server_name _;
    include snippets/portfolio-tls-ip.conf;
    include snippets/portfolio-robots-disallow.conf;   # 앱은 색인 대상이 아니다

    client_max_body_size 20m;
    limit_conn portfolio_conn 40;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/classify {
        limit_req zone=portfolio_upload burst=10 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_loandoc;
    }

    location /api/ {
        limit_req zone=portfolio_api burst=20 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_loandoc;
    }

    location ~ ^/(docs|redoc|openapi\.json) {
        deny all;
        access_log off;
    }

    location / {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_loandoc;
    }
}
