# http 컨텍스트 드롭인. 우분투 기본 nginx.conf 의 http 블록이 conf.d/*.conf 를 include 하므로,
# 저장소가 소유하지 않는 nginx.conf 를 건드리지 않고 http 레벨 설정을 넣을 수 있다.
# 배치: /etc/nginx/conf.d/portfolio-hardening.conf (infra/apply-hardening.sh 가 설치)
#
# 전제: 이 서버는 **엣지**다. 앞에 다른 프록시나 CDN 이 없다(단일 EC2, 도메인 A 레코드 직결).
#       아래 XFF 처리와 rate limit 키(=$binary_remote_addr)가 이 전제 위에 서 있다.

# ── 버전 은닉 ────────────────────────────────────────────────────────────
# 응답 헤더와 에러 페이지에서 nginx 버전을 뗀다. 취약점 스캐너가 버전으로 표적을 고르는 것을
# 막지는 못하지만(배너 그래빙은 다른 수단도 있다), 공짜로 줄 정보는 아니다.
server_tokens off;

# ── slowloris 방어 ───────────────────────────────────────────────────────
# 헤더나 바디를 아주 느리게 흘리며 연결만 붙잡아 워커를 고갈시키는 공격. nginx 기본값(60초)은
# 이 용도에 관대하다. 업로드 데모가 있어 바디는 헤더보다 넉넉히 준다.
client_header_timeout 15s;
client_body_timeout   30s;
send_timeout          30s;

# ── 남용/DoS 방어 존 ─────────────────────────────────────────────────────
# §0 경계상 이 데모들은 **무인증 공개**다. 인증이 막아 줄 것이 없으니 엣지에서 막는다.
#
# 값을 정한 기준: "사람은 절대 걸리지 않고, 자동화만 걸린다". 평가자가 빠르게 클릭하는 것은
# 정상 사용이고, 그 사람에게 429 를 보여주는 순간 포트폴리오로서는 실패다. 그래서 사람의
# 상한(초당 몇 회)보다 한참 위, 남용의 하한(초당 수십~수백)보다 아래에 선을 긋는다.
limit_req_zone  $binary_remote_addr zone=portfolio_api:10m    rate=10r/s;
limit_req_zone  $binary_remote_addr zone=portfolio_upload:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=portfolio_conn:10m;

# 기본값은 503(서버 잘못)이다. 요청자 쪽 사유이므로 429 가 맞고, 모니터링에서도 구분된다.
limit_req_status  429;
limit_conn_status 429;

# ── upstream 연결 재사용 ─────────────────────────────────────────────────
# 이전에는 `proxy_pass http://127.0.0.1:3000` 처럼 주소를 직접 적었다. 그러면 upstream 블록이
# 없어 keepalive 풀도 없고, 요청마다 백엔드로 TCP 를 새로 연다. 루프백이라 비용이 크진 않지만
# 공짜로 없앨 수 있는 낭비다. keepalive 를 쓰려면 proxy_http_version 1.1 과
# `Connection ""` 이 함께 필요하다(스니펫 portfolio-proxy-app.conf 에 있다).
upstream portfolio_chat     { server 127.0.0.1:3000; keepalive 32; }
upstream portfolio_exchange { server 127.0.0.1:3010; keepalive 32; }
upstream portfolio_docqa    { server 127.0.0.1:3030; keepalive 32; }
upstream portfolio_backend  { server 127.0.0.1:8080; keepalive 32; }
upstream portfolio_loandoc  { server 127.0.0.1:8000; keepalive 32; }
