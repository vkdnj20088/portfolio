# 인트로(정적 파일)용 응답 헤더. 배치: /etc/nginx/snippets/portfolio-static-headers.conf
#
# 왜 인트로만 따로 필요한가: 데모 다섯 개는 프록시 뒤의 앱(Next / Spring)이 자기 헤더를 직접
# 붙인다. 인트로만 nginx 가 파일을 그대로 내보내므로 붙여 줄 주체가 없어, 도메인을 붙이기
# 전까지 HSTS 하나만 나가고 있었다. 첫 화면만 헤더가 비는 상태였다.
#
# add_header 상속 규칙: 하위 레벨에 add_header 가 하나라도 있으면 상위 레벨 것이 통째로
# 사라진다(누적이 아니다). 그래서 Cache-Control 을 쓰는 location 에서 이 스니펫을 다시
# include 한다. HSTS 도 여기 함께 넣어 두 스니펫을 겹쳐 부르지 않게 했다.

# CSP - 이 페이지가 실제로 쓰는 것만 열어 둔다.
#
#   script-src 에 'unsafe-inline' 이 필요한 이유:
#   웹폰트를 렌더 차단 없이 불러오려고 `media="print" onload="this.media='all'"` 패턴을 쓴다.
#   이건 인라인 이벤트 핸들러라 nonce 로는 허용되지 않는다(nonce 는 <script> 블록에만 적용된다).
#   거래소 데모처럼 nonce+strict-dynamic 을 쓰려면 nginx sub_filter 로 매 응답에 nonce 를
#   심고 이 핸들러를 걷어내야 하는데, 정적 페이지에는 주입 경로 자체가 없다(사용자 입력도,
#   서버 렌더링도, 외부 데이터도 없다). 막을 것이 없는 위험에 랜딩 페이지가 조용히 깨질
#   실패 경로를 더하는 거래라 하지 않았다. 실제로 값을 하는 것은 아래 두 줄이다:
#   object-src 'none' 과 frame-ancestors 'none'(클릭재킹).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

# frame-ancestors 를 모르는 구형 브라우저용 이중 방어.
add_header X-Frame-Options            "DENY"        always;
# 스크린샷 10장이 MIME 스니핑으로 다른 타입 취급되는 것을 막는다.
add_header X-Content-Type-Options     "nosniff"     always;
# 데모로 이동할 때 방문 경로를 넘기지 않는다.
add_header Referrer-Policy            "no-referrer" always;
# 정적 소개 페이지가 쓸 일 없는 기기 권한을 전부 닫는다.
add_header Permissions-Policy         "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;

# HSTS. .dev 는 TLD 전체가 브라우저 프리로드 목록에 있어 이 헤더 없이도 HTTPS 가 강제되지만,
# 프리로드를 모르는 클라이언트(구형 브라우저, 각종 도구)와 IP 접속에도 같은 정책을 적용한다.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
