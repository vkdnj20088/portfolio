# 도메인 인증서용 TLS 설정. 도메인 서버 블록들이 이 한 장(SAN 다중 이름)을 공유한다.
# 배치: /etc/nginx/snippets/portfolio-tls-domain.conf
#
# CERT_DIR 는 발급 후 issue-cert-domain.sh 가 실제 경로로 치환한다.
# IP 인증서(tls-ip.conf)와 달리 여기는 표준 90일 인증서다 - 6일 갱신 압박이 없다.
ssl_certificate     /etc/letsencrypt/live/CERT_DIR/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/CERT_DIR/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
# OCSP stapling 은 켜지 않는다. Let's Encrypt 가 OCSP 를 폐지해 인증서에 응답자 URL 이 없고,
# nginx 는 그 상태에서 resolver 설정까지 요구하며 경고만 남긴다 - 얻는 것이 없다.

include snippets/portfolio-hsts.conf;
