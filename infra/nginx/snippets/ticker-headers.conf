# JC Ticker(Flutter web, 정적)용 응답 헤더. 배치: /etc/nginx/snippets/portfolio-ticker-headers.conf
#
# 인트로와 같은 이유로 필요하다: 프록시 뒤 앱이 아니라 nginx 가 파일을 직접 내보내므로
# 헤더를 붙여 줄 주체가 없다. 다만 CSP 는 인트로 것을 재사용할 수 없다 - Flutter web 은
# 정적 HTML 과 실행 프로필이 다르다:
#
#   script-src 'wasm-unsafe-eval': CanvasKit/skwasm 렌더러가 WebAssembly.instantiate 를
#     쓴다. 이것이 없으면 엔진이 아예 부팅하지 않는다. 'unsafe-eval' 전체가 아니라
#     wasm 한정 완화라는 점이 이 지시자의 존재 이유다.
#   connect-src/font-src 의 gstatic: Flutter web 은 번들에 없는 글리프(예: 일부 한글)를
#     만나면 Noto 폴백 폰트를 fonts.gstatic.com 에서 글리프 구간 단위로 받아온다.
#     막으면 해당 글자만 tofu(□)로 남는다 - 실측으로 확인했다. 폰트 전체를 번들하는
#     대안은 수 MB 를 항상 내려받게 해 기각했다(어차피 초기 페이로드가 이 데모의 관측
#     대상이라 README 에 수치로 공개한다).
#   style-src 'unsafe-inline': 엔진이 스타일 요소를 런타임에 주입한다.
#   worker-src blob:: skwasm 렌더러의 워커 부트스트랩 경로. 현재 배포는 COOP/COEP 를
#     붙이지 않아 단일 스레드로 동작하지만, 지시자가 없으면 지원 브라우저에서 콘솔
#     에러가 남는다.
#
# **www.gstatic.com 은 일부러 허용하지 않는다.** Flutter 는 기본값으로 렌더러(skwasm)를
# www.gstatic.com/flutter-canvaskit/<해시>/ 에서 받아온다 - 산출물 안에 canvaskit/ 이
# 들어 있어도 그렇다. 여기를 열어 주는 대신 빌드에서 --no-web-resources-cdn 으로 동봉본을
# 쓰게 했다. CSP 를 넓히면 렌더러 코드의 출처가 서드파티 CDN 이 되고(무결성 검증 수단도
# 없다), 그 CDN 이 죽으면 데모도 같이 죽는다. 참고로 fonts.gstatic.com 은 다른 호스트이고,
# 폰트 폴백 때문에 위에서 명시적으로 허용한 출처다.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com; img-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

add_header X-Frame-Options            "DENY"        always;
add_header X-Content-Type-Options     "nosniff"     always;
add_header Referrer-Policy            "no-referrer" always;
add_header Permissions-Policy         "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
