# Next 이미지 최적화 API(/_next/image)를 닫는다. 서버에는 /etc/nginx/snippets/portfolio-block-next-image.conf 로 둔다.
# 2026-11-20: Next 16.2.12 의 이 경로에 인증 없는 원격 코드 실행(GHSA-2xp9-vwfh-vxw4 AVIF, GHSA-2464-fhr4-w9xw SVG)과
# SSRF(GHSA-cjq9-62q9-8jv4)가 공지돼 먼저 막았다. 이 사이트들은 최적화할 이미지가 없다(로고는 인라인 SVG) -
# 막아도 화면에 변화가 없으므로 Next 를 올린 뒤에도 공격면 축소로 남겨 둔다.
location ^~ /_next/image { return 404; }
