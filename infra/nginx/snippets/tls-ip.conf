# 포트마다 반복되는 TLS 설정. 다섯 개 블록이 같은 IP 인증서 한 장을 공유한다.
# 배치: /etc/nginx/snippets/portfolio-tls-ip.conf (provision.sh 가 복사한다)
#
# CERT_DIR 는 발급 후 실제 경로로 치환한다(setup-tls-ip.sh 참고).
# OCSP stapling / HSTS 없음: 단수명 IP 인증서는 폐기 정보를 갖지 않고, 브라우저는 IP 리터럴
# 호스트에 HSTS 를 적용하지 않는다.
ssl_certificate     /etc/letsencrypt/live/CERT_DIR/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/CERT_DIR/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
