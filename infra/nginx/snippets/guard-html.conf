# JC Guard 진입 HTML 의 캐시 정책. 배치: /etc/nginx/snippets/portfolio-guard-html.conf
#
# 이 앱의 진입 HTML 에는 Cache-Control 이 하나도 없었다. 헤더가 없으면 브라우저는 Last-Modified
# 를 근거로 **마음대로** 캐시한다(휴리스틱 신선도). 그런데 webpack 산출물은 콘텐츠 해시
# 파일명이고 배포가 옛 해시를 지우므로, 캐시에서 꺼낸 옛 HTML 이 가리키는 JS/CSS 는 404 가 된다.
# 재방문자에게 스타일도 스크립트도 없는 화면이 뜬다 - 실제로 겪었고, 브라우저 캐시를 끄기
# 전까지는 원인이 배포 누락처럼 보였다.
#
# 인트로(no-store)와 Next 세 앱(프레임워크 기본)은 이미 막고 있었고 여기만 비어 있었다.
#
# 자산(/css/*, /js/*)에는 손대지 않는다. Spring 이 이미 max-age=31536000, immutable 을 붙이고
# 있어서, 여기서 add_header 로 또 붙이면 값이 충돌하는 Cache-Control 이 두 줄 나간다.
# 그래서 정확히 두 진입 문서만 `location =`(최우선 매치)로 집어낸다.
location = / {
    include snippets/portfolio-proxy-app.conf;
    proxy_pass http://portfolio_backend;
    add_header Cache-Control "no-store";
    include snippets/portfolio-hsts.conf;   # add_header 를 쓰면 상위 HSTS 가 사라진다
}

location = /ip.html {
    include snippets/portfolio-proxy-app.conf;
    proxy_pass http://portfolio_backend;
    add_header Cache-Control "no-store";
    include snippets/portfolio-hsts.conf;
}
