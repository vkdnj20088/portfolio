# 데모 서브도메인용 robots.txt. 배치: /etc/nginx/snippets/portfolio-robots-disallow.conf
#
# 데모는 문서가 아니라 조작하는 앱이다. 크롤러를 풀어 두면 대화방 URL 이나 검색 결과 같은
# 내부 경로가 색인되어, 정작 봐야 할 인트로 대신 그것들이 검색에 뜬다. 인트로(apex)만
# 열어 두고 나머지는 닫는다.
#
# 왜 파일로 응답하지 않고 return 인가: 데모 블록은 전부 프록시라 서빙할 파일시스템이 없다.
# 앱에 robots.txt 를 두면 다섯 앱을 각각 고쳐야 하는데, 이건 배포 형상의 문제지 앱의 문제가
# 아니다.
#
# add_header 가 아니라 default_type 을 쓰는 이유: add_header 를 쓰면 상위 레벨의 헤더(HSTS 등)가
# 통째로 사라진다. default_type 은 그 규칙과 무관하게 Content-Type 만 바꾼다.
location = /robots.txt {
    default_type text/plain;
    access_log off;
    return 200 "User-agent: *\nDisallow: /\n";
}
