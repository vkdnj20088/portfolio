# HSTS 한 줄만 담은 스니펫. 배치: /etc/nginx/snippets/portfolio-hsts.conf
#
# 왜 파일로 떼어냈나: nginx 의 add_header 는 **현재 레벨에 add_header 가 하나라도 있으면
# 상위 레벨의 add_header 를 통째로 버린다**(누적이 아니다). 그래서 server 레벨에만 HSTS 를 두면
# `add_header Cache-Control ...` 를 쓰는 location(인트로의 /index.html, 각 앱의 /_next/static/)
# 에서 HSTS 가 조용히 사라진다. 그런 location 마다 이 스니펫을 다시 include 해서 되살린다.
#
# .dev 는 TLD 전체가 브라우저 HSTS 프리로드 목록에 있어 이 헤더 없이도 HTTPS 가 강제되지만,
# 헤더를 명시해 두면 프리로드를 모르는 클라이언트(구형 브라우저, 각종 도구)에도 동일하게 적용된다.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
