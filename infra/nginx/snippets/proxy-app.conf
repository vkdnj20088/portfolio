# 앱 프록시 공통 헤더. 배치: /etc/nginx/snippets/portfolio-proxy-app.conf
#
# proxy_pass 는 블록마다 다르므로 여기 두지 않는다(upstream 이름이 곧 앱 구분).
proxy_http_version 1.1;
# upstream keepalive 를 실제로 쓰려면 이 줄이 있어야 한다. 없으면 nginx 가 백엔드로
# `Connection: close` 를 보내 연결이 풀에 반납되지 않는다
# (upstream 정의는 conf.d/portfolio-hardening.conf 에 있다).
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# XFF 는 이어 붙이지 않고 **덮어쓴다**.
# 기본형 $proxy_add_x_forwarded_for 는 "클라이언트가 보낸 XFF, 실제 IP" 로 이어 붙인다.
# 이 서버는 엣지라 앞단에 신뢰할 프록시가 없으므로 클라이언트가 보낸 XFF 는 전부 위조 후보다.
# 그대로 넘기면 Spring 의 forward-headers 처리가 목록 **앞쪽**을 실제 클라이언트로 신뢰해서,
# whoami 와 감사로그의 actor IP 를 요청자가 마음대로 정할 수 있다
# (하필 IP 접근제어 데모라 더 뼈아프다). $remote_addr 로 덮으면 위조분이 통째로 버려진다.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port  $server_port;
