# 도메인(SNI) 기반 라우팅 - 인트로 + 데모 다섯을 **443 한 포트**에서 서브도메인으로 가른다.
#
#   https://jongeunchoi.dev/           -> 인트로 랜딩(정적)   /var/www/intro
#   https://exchange.jongeunchoi.dev/  -> JC Exchange (Next)  portfolio_exchange (3010)
#   https://chat.jongeunchoi.dev/      -> JC Chat    (Next)   portfolio_chat     (3000)
#   https://docqa.jongeunchoi.dev/     -> JC DocuQA  (Next)   portfolio_docqa    (3030)
#   https://file.jongeunchoi.dev/      -> 파일 확장자 차단     portfolio_backend  (8080) "/"
#   https://ip.jongeunchoi.dev/        -> IP 접근 제어         portfolio_backend  (8080) "/ip.html"
#   https://guard.jongeunchoi.dev/     -> 위 둘의 원래 주소(유지)
#   https://loandoc.jongeunchoi.dev/   -> JC LoanDoc (FastAPI) portfolio_loandoc (8000)
#   https://search.jongeunchoi.dev/    -> docqa/search 로 301
#   https://www.jongeunchoi.dev/       -> apex 로 301
#
# 포트 분리 설정(portfolio.conf)과 **함께** 켜 둔다. 둘은 충돌하지 않는다:
#  - 도메인으로 오면 TLS 핸드셰이크에 SNI 가 실려 여기 server_name 블록이 잡는다.
#  - IP 리터럴로 오면 SNI 가 없어 portfolio.conf 의 default_server(IP 인증서)가 받는다.
# 덕분에 전환 중 다운타임이 없고, 도메인이 만료돼도 IP 주소로는 계속 열린다.
#
# 배치: /etc/nginx/sites-available/portfolio-domain (issue-cert-domain.sh 가 활성화한다)
# 의존: conf.d/portfolio-hardening.conf (upstream 정의 + limit 존). 없으면 nginx -t 가 실패한다.
# 인증서: 열 이름을 한 장(SAN)으로(loandoc 추가 시 재발급 필요 - issue-cert-domain.sh).
#         경로는 snippets/portfolio-tls-domain.conf 한 곳에만 있다.
# HTTP/2 표기가 `listen ... ssl http2` 인 이유는 portfolio.conf 주석 참고(1.24/1.25+ 양쪽 안전).
#
# 80 포트(ACME + 리다이렉트)는 portfolio.conf 의 블록이 server_name _ 로 이미 모든 호스트를
# 받으므로 여기서 다시 정의하지 않는다 - 중복 정의하면 default_server 충돌로 nginx 가 뜨지 않는다.

# ── www -> apex 정규화 ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jongeunchoi.dev;
    include snippets/portfolio-tls-domain.conf;

    return 301 https://jongeunchoi.dev$request_uri;
}

# ── 인트로 랜딩 (apex) ────────────────────────────────────────────────────
# 데모 링크는 인트로의 스크립트가 "지금 호스트"에서 조립한다. 도메인으로 접속하면
# 서브도메인 주소를, IP 로 접속하면 포트 주소를 만든다 - 양쪽 다 고칠 곳이 없다.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jongeunchoi.dev;
    include snippets/portfolio-tls-domain.conf;

    root /var/www/intro;
    index index.html;
    limit_conn portfolio_conn 40;

    # 데모는 앱이 자기 헤더를 붙이지만 인트로는 nginx 가 파일을 그대로 내보낸다 - 여기서 붙인다.
    include snippets/portfolio-static-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 닷파일 차단. 여기서만 파일시스템을 직접 서빙하므로(다른 블록은 전부 프록시),
    # .git/.env 같은 것이 웹루트에 섞여 들어가는 사고는 이 블록에서만 의미가 있다.
    # 80 포트의 ACME 경로(`^~ /.well-known/...`)는 접두 매치라 이 정규식보다 우선순위가
    # 높고, 애초에 다른 server 블록이라 영향이 없다.
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # 진입 문서는 캐시하지 않는다 - 데모 링크/문구를 고치면 즉시 반영돼야 한다.
    location = /index.html {
        add_header Cache-Control "no-store";
        include snippets/portfolio-static-headers.conf;  # 상위 add_header 가 사라지므로 다시
    }

    # 이미지는 **저장하되 매번 재검증**한다(no-cache). 다운로드는 바뀔 때만 일어난다.
    #
    # 처음에는 max-age=3600 + stale-while-revalidate=86400 을 걸었다가 되돌렸다. 그게 아끼는
    # 것은 조건부 요청 열 번인데, 재 보니 304 응답은 **본문 0바이트**다. 반면 치르는 대가는
    # 교체 후 최대 25시간(1h fresh + 24h stale) 동안 옛 스크린샷이 보이는 것이었다.
    # 스크린샷은 이 페이지의 곁가지가 아니라 내용 그 자체라, 낡은 것을 보여 주는 쪽이 훨씬 비싸다.
    # 근거 없이 넣은 최적화였다.
    #
    # no-cache 는 no-store 와 다르다. 브라우저는 이미지를 그대로 보관하고, 쓰기 전에 ETag 로
    # "바뀌었나"만 묻는다. 안 바뀌었으면 304 를 받고 캐시에서 즉시 그린다 - 화면 체감은 같고
    # 트래픽만 사라진다. 파일명에 해시가 없어 immutable 을 걸 수 없는 자산의 정석이다.
    location ~* \.(jpg|jpeg|png|webp|svg|ico)$ {
        add_header Cache-Control "no-cache";
        include snippets/portfolio-static-headers.conf;  # 상위 add_header 가 사라지므로 다시
        try_files $uri =404;
    }

    # 없는 경로는 404 로 끝낸다.
    #
    # 마지막 인자를 /index.html 로 두는 것은 **SPA 관용구**다. SPA 에서는 "서버에 없는 경로"가
    # "클라이언트 라우터가 처리할 경로"라서 200 이 맞지만, 이 페이지에는 라우터가 없다. 없는
    # 경로는 진짜로 없는 경로다. 그대로 두면 스크린샷 경로에 오타가 났을 때 브라우저에는 깨진
    # 이미지가 뜨는데 응답은 200(랜딩 HTML 전문)이라, 실패가 로그에도 모니터링에도 안 남는다.
    # 덤으로 검색엔진이 존재하지 않는 URL 을 전부 랜딩 페이지로 색인한다(soft 404).
    location / {
        try_files $uri $uri/ =404;
    }
}

# ── JC Exchange ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name exchange.jongeunchoi.dev;
    include snippets/portfolio-tls-domain.conf;
    include snippets/portfolio-robots-disallow.conf;   # 앱은 색인 대상이 아니다

    client_max_body_size 5m;
    limit_conn portfolio_conn 40;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /_next/static/ {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_exchange;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/portfolio-hsts.conf;
    }

    location /api/ {
        limit_req zone=portfolio_api burst=20 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_exchange;
    }

    location / {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_exchange;
    }
}

# ── JC Chat ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.jongeunchoi.dev;
    include snippets/portfolio-tls-domain.conf;
    include snippets/portfolio-robots-disallow.conf;   # 앱은 색인 대상이 아니다

    client_max_body_size 5m;
    limit_conn portfolio_conn 40;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /_next/static/ {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_chat;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/portfolio-hsts.conf;
    }

    # SSE(/api/reply): 프록시 버퍼링을 끈다. 버퍼링되면 응답이 한 번에 쏟아져 스트리밍이 죽는다.
    # 응답이 120초까지 열려 있는 비싼 엔드포인트라 rate limit 을 함께 건다.
    location = /api/reply {
        limit_req zone=portfolio_api burst=10 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_chat;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=portfolio_api burst=20 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_chat;
    }

    location / {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_chat;
    }
}

# ── JC DocuQA ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docqa.jongeunchoi.dev;
    include snippets/portfolio-tls-domain.conf;
    include snippets/portfolio-robots-disallow.conf;   # 앱은 색인 대상이 아니다

    client_max_body_size 5m;
    limit_conn portfolio_conn 40;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /_next/static/ {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_docqa;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/portfolio-hsts.conf;
    }

    # SSE(/api/answer) - 근거 QA 답변 스트리밍.
    location = /api/answer {
        limit_req zone=portfolio_api burst=10 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_docqa;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=portfolio_api burst=20 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_docqa;
    }

    location / {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_docqa;
    }
}

# ── JC Guard : 한 Spring 앱의 두 화면을 각각 자기 서브도메인으로 ──────────
#
# file.  -> 파일 확장자 차단 (앱의 "/")
# ip.    -> IP 접근 제어    (앱의 "/ip.html")
# guard. -> 위 둘의 원래 주소. 남겨 둔다(예전 링크가 죽지 않게).
#
# 이 앱은 jQuery + Spring 서버 렌더라 클라이언트 라우터가 없다. 그래서 "주소는 / 인데 내용은
# /ip.html" 같은 매핑이 안전하다 - 정적 자산(/css/*)과 API(/api/*)는 절대경로라 그대로 통과하고,
# 뒤로가기/새로고침도 서버가 매번 같은 답을 준다. Next 앱에는 같은 수법을 쓸 수 없다(아래 search 참고).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guard.jongeunchoi.dev file.jongeunchoi.dev;
    include snippets/portfolio-tls-domain.conf;
    include snippets/portfolio-robots-disallow.conf;   # 앱은 색인 대상이 아니다
    include snippets/portfolio-guard-html.conf;   # 진입 HTML 은 캐시하지 않는다

    client_max_body_size 10m;            # 파일 검증 데모(멀티파트 5MB + 여유)
    limit_conn portfolio_conn 40;

    # 심층 방어: 운영 도구 표면을 엣지에서도 닫는다. 앱단에서 이미 prod 는 actuator 를
    # health/info 로 제한하고 springdoc 을 끄지만, 설정 한 줄 실수로 열리는 표면이라 이중으로 막는다.
    # 배포 헬스 게이트는 서버 안에서 127.0.0.1:8080 을 직접 치므로 이 차단에 걸리지 않는다.
    location ~ ^/(actuator|swagger-ui|v3/api-docs|h2-console) {
        deny all;
        access_log off;
    }

    # 업로드는 CPU(Tika 파싱)와 디스크(격리 저장)를 함께 먹는 유일한 경로다. 별도 존으로 더 조인다.
    # burst 10 이라 사람이 파일 여러 개를 빠르게 던져 보는 것은 그대로 통과한다.
    location /api/files {
        limit_req zone=portfolio_upload burst=10 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_backend;
    }

    location /api/ {
        limit_req zone=portfolio_api burst=20 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_backend;
    }

    location / {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_backend;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ip.jongeunchoi.dev;
    include snippets/portfolio-tls-domain.conf;
    include snippets/portfolio-robots-disallow.conf;   # 앱은 색인 대상이 아니다

    client_max_body_size 10m;
    limit_conn portfolio_conn 40;

    location ~ ^/(actuator|swagger-ui|v3/api-docs|h2-console) {
        deny all;
        access_log off;
    }

    # 루트만 IP 화면으로 바꾼다. proxy_pass 에 경로(/ip.html)를 붙이면 nginx 가 요청 URI 를
    # 그 경로로 "치환"한다 - location = / 이라 정확히 루트일 때만 걸린다.
    #
    # 이 블록은 guard-html.conf 를 include 하지 않는다. 저 스니펫의 location = / 는 경로를
    # 치환하지 않아 여기 규칙과 충돌한다. 캐시 정책만 같은 값으로 직접 적는다.
    location = / {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_backend/ip.html;
        add_header Cache-Control "no-store";
        include snippets/portfolio-hsts.conf;
    }

    # ip. 로 들어와 /ip.html 을 직접 친 경우(예전 링크, 새로고침). 위와 같은 문서다.
    location = /ip.html {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_backend;
        add_header Cache-Control "no-store";
        include snippets/portfolio-hsts.conf;
    }

    location /api/ {
        limit_req zone=portfolio_api burst=20 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_backend;
    }

    # 나머지(/css/*, /js/*, /favicon.*)는 1:1 통과. 경로를 붙이지 않는 것이 핵심이다.
    location / {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_backend;
    }
}

# ── JC LoanDoc : 대출 서류 분류 (Python/FastAPI) ──────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name loandoc.jongeunchoi.dev;
    include snippets/portfolio-tls-domain.conf;
    include snippets/portfolio-robots-disallow.conf;   # 앱은 색인 대상이 아니다

    # 앱 자체 상한은 100MB 지만 엣지에서는 20m 으로 더 조인다. 데모 패키지는 수 MB 면
    # 충분하고, 남는 80MB 는 정상 사용이 아니라 대역폭 소모 표면이다. 앱 상한(코드)을
    # 내리지 않는 이유: 로컬/실무 환경에서는 100MB 급 패키지가 실재하기 때문이다.
    client_max_body_size 20m;
    limit_conn portfolio_conn 40;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 업로드 분류는 CPU(추출·시각화)를 먹는 유일한 경로다. guard 업로드와 같은 존으로 조인다.
    location /api/classify {
        limit_req zone=portfolio_upload burst=10 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_loandoc;
    }

    location /api/ {
        limit_req zone=portfolio_api burst=20 nodelay;
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_loandoc;
    }

    # FastAPI 자동 문서 표면은 데모에 불필요 - 엣지에서 닫는다(guard 의 actuator 차단과 같은 원칙).
    location ~ ^/(docs|redoc|openapi\.json) {
        deny all;
        access_log off;
    }

    location / {
        include snippets/portfolio-proxy-app.conf;
        proxy_pass http://portfolio_loandoc;
    }
}

# ── JC Ticker : 실시간 관심종목 (Flutter web, 정적) ───────────────────────
#
# 유닛 없는 첫 "앱" 데모다. Flutter web 빌드 산출물은 정적 파일이라 프로세스가 필요 없고,
# 인트로처럼 nginx 가 직접 서빙한다 - 릴리스/재기동/롤백 없이 rsync 로 통째로 맞춘다.
#
# 캐시 정책이 다른 데모와 다른 이유: Flutter web 산출물은 파일명에 해시가 없다.
# 갱신 판정은 flutter_service_worker.js 안의 버전 맵이 한다 - 진입 문서와 서비스워커를
# 캐시하면 재배포가 화면에 영영 반영되지 않는다(stale 서비스워커가 옛 자산을 계속 쓴다).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ticker.jongeunchoi.dev;
    include snippets/portfolio-tls-domain.conf;
    include snippets/portfolio-robots-disallow.conf;   # 앱은 색인 대상이 아니다
    include snippets/portfolio-ticker-headers.conf;    # 정적 서빙이라 헤더를 여기서 붙인다

    root /var/www/ticker;
    index index.html;
    limit_conn portfolio_conn 40;

    gzip on;
    # wasm(약 2MB)이 전송량의 대부분이다 - 압축 대상에 반드시 포함한다.
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    location ~ /\. { deny all; access_log off; log_not_found off; }

    # 갱신의 생명선 둘은 절대 캐시하지 않는다.
    location = /index.html {
        add_header Cache-Control "no-store";
        include snippets/portfolio-ticker-headers.conf;  # 상위 add_header 가 사라지므로 다시
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store";
        include snippets/portfolio-ticker-headers.conf;
    }

    # 무거운 산출물(wasm/js/폰트)은 저장하되 매번 재검증(no-cache). 파일명에 해시가 없어
    # immutable 을 걸 수 없는 자산의 정석이다 - 304 는 본문 0바이트라 재방문이 사실상 공짜다
    # (인트로 이미지와 같은 판단, 근거 주석은 인트로 블록에).
    location ~* \.(wasm|mjs|js|json|otf|ttf|png|ico)$ {
        add_header Cache-Control "no-cache";
        include snippets/portfolio-ticker-headers.conf;
        try_files $uri =404;
    }

    # SPA 서버 라우팅이 없다 - 없는 경로는 404 로 끝낸다(인트로와 같은 판단).
    # $uri/ 가 있어야 "/" 가 index 처리로 넘어간다(빼면 루트가 404 가 된다).
    location / {
        try_files $uri $uri/ =404;
    }
}

# ── 시맨틱 검색: 리다이렉트 (프록시가 아니다) ─────────────────────────────
#
# 왜 file./ip. 처럼 못 하는가: DocuQA 는 Next App Router 다. "주소는 / 인데 서버는 /search 를
# 렌더" 로 만들면 라우터 상태(/search)와 주소창(/)이 어긋난다. 그 상태에서 앱 안의 링크를 누르면
# RSC 요청이 엉뚱한 경로로 나가 다른 페이지가 그려진다. 겉보기엔 되는데 클릭 한 번에 깨지는,
# 가장 나쁜 종류의 설정이다.
#
# 그래서 짧은 주소는 **입구**로만 쓰고 목적지로 넘긴다. 주소창은 docqa 로 바뀐다.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name search.jongeunchoi.dev;
    include snippets/portfolio-tls-domain.conf;
    include snippets/portfolio-robots-disallow.conf;   # 앱은 색인 대상이 아니다

    return 301 https://docqa.jongeunchoi.dev/search;
}
