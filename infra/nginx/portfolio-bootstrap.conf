# 부트스트랩 사이트(80 포트만). 인증서를 발급받기 "전" 단계에서만 쓴다.
#
# 왜 필요한가(닭과 달걀): 본 설정 portfolio.conf 의 TLS 블록들은 아직 존재하지 않는 인증서 파일을
# 가리킨다 -> `nginx -t` 가 실패하고 nginx 가 뜨지 않는다 -> 80 포트의 ACME 경로도 서빙되지 않는다
# -> 발급 자체가 불가능해진다. 그래서 발급 전에는 이 파일만 켜 두고, 발급이 끝나면
# issue-cert-ip.sh 가 인증서 경로를 스니펫에 심은 뒤 본 설정으로 교체한다.
#
# 배치: provision.sh 가 /etc/nginx/sites-available/portfolio-bootstrap 으로 두고 활성화한다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME(http-01) 챌린지. 발급·갱신의 생명선이라 항상 최상단에 둔다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # 아직 HTTPS 가 없으므로 443 으로 보내지 않는다(보내면 무한 실패로 보인다).
    location / {
        default_type text/plain;
        return 200 "portfolio: TLS 발급 대기 중 (infra/issue-cert-ip.sh 실행 전)\n";
    }
}
