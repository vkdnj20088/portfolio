<!-- JC 모노그램 - app/icon 파일 규약으로 Next 가 <link rel="icon"> 을 자동 생성한다.
     링크가 있으면 브라우저가 /favicon.ico 를 요청하지 않아 404 콘솔 오류도 사라진다.
     포트폴리오 전 페이지(거래소/챗봇/확장자차단/인트로) 파비콘을 JC 로 통일. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="JC 포트폴리오">
  <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="#141414"/>
  <text x="16" y="16.5" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f7911d" letter-spacing="-0.5">JC</text>
</svg>
