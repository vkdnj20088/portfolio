packages:
  - 'apps/*'
  - 'packages/*'

# 설치 시 postinstall 스크립트 실행을 허용할 패키지를 명시한다(pnpm 기본은 차단).
# 임의 패키지의 빌드 스크립트가 무조건 실행되지 않게 하는 공급망 안전장치이고,
# 20명이 각자 승인 프롬프트를 만나지 않도록 결정을 저장소에 고정해 둔다.
allowBuilds:
  # esbuild(vitest 의 vite 가 사용)의 postinstall 은 플랫폼 바이너리 검증/설치용이다.
  # pnpm 에서는 바이너리가 optionalDependencies(@esbuild/<platform>)로 직접 오므로
  # 스크립트 없이도 동작한다 - 거부하고, 테스트 실행으로 실증했다.
  esbuild: false
  # sharp 는 next/image 의 래스터 이미지 최적화에만 필요하다.
  # 이 앱의 유일한 이미지인 로고는 인라인 SVG 라 최적화 대상이 없다.
  # -> 거부해서 네이티브 빌드 단계를 없애고 설치를 가볍게 유지한다.
  sharp: false

minimumReleaseAgeExclude:
  - jsdom@30.0.1
