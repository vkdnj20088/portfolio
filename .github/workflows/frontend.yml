# portfolio_react_next (Next / React) 파이프라인.
# GitHub 은 루트 .github/workflows 만 실행하므로 워크플로를 모노레포 루트에 둔다.
# paths 필터로 프론트엔드 서브트리 변경에만 반응하고, run 스텝은 서브폴더에서 돈다.
name: frontend

on:
  push:
    branches: ['**']
    paths:
      - 'portfolio_react_next/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'portfolio_react_next/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

# 같은 브랜치의 이전 실행은 취소한다(러너 시간 절약).
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

# run 스텝만 서브폴더에서 실행된다. uses 스텝의 경로 입력은 루트 기준이라 아래에서 명시한다.
defaults:
  run:
    working-directory: portfolio_react_next

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 서브폴더 package.json 의 packageManager 필드가 단일 진실원이다.
      # 루트에 package.json 이 없으므로 경로를 명시한다.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: portfolio_react_next/package.json

      - uses: actions/setup-node@v4
        with:
          # Node 버전은 서브폴더 .nvmrc 하나만 따른다 - CI 와 로컬이 어긋나지 않게.
          node-version-file: portfolio_react_next/.nvmrc
          cache: pnpm
          cache-dependency-path: portfolio_react_next/pnpm-lock.yaml

      # frozen-lockfile: CI 가 lockfile 을 조용히 고쳐 쓰는 일을 금지한다.
      # lockfile 과 manifest 가 어긋나 있으면 설치 자체가 실패해야 한다.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # 산출물이 지원 하한(Chrome 111 = ES2022)을 넘지 않는지 - 빌드 뒤에만 의미가 있다.
      - run: pnpm check:browser-support

  # 실제 브라우저 계층(Playwright) - jsdom 이 재현 못 하는 규칙만 크로미움에서 실측한다:
  # 스크롤 앵커링(scrollHeight 산술)과 prefers-reduced-motion 분기(matchMedia).
  # verify(빠른 단위/타입/빌드)와 분리해 병렬로 돌린다.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: portfolio_react_next/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: portfolio_react_next/.nvmrc
          cache: pnpm
          cache-dependency-path: portfolio_react_next/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 크로미움 + OS 의존성 설치(러너에 사전 설치가 없다).
      - run: pnpm --filter @wrtn/chat exec playwright install --with-deps chromium

      # playwright.config.ts 의 webServer 가 next build 후 앱을 띄우고 스펙을 돌린다.
      - run: pnpm --filter @wrtn/chat test:e2e

      # 실패 원인 추적용 리포트(트레이스 포함)를 항상 업로드한다.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: portfolio_react_next/apps/chat/playwright-report/
          retention-days: 7
