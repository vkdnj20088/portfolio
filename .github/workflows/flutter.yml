# portfolio_flutter (JC Ticker) 파이프라인.
# frontend.yml 에 얹지 않고 분리한 이유: 트리거 경로, 툴체인(pnpm/Node vs Flutter SDK),
# 캐시 키가 전부 달라 한 파일에 섞으면 서로의 변경에 서로가 다시 돈다.
name: flutter

on:
  push:
    branches: ['**']
    paths:
      - 'portfolio_flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'portfolio_flutter/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio_flutter

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 버전은 로컬 개발 환경과 같은 값으로 핀 고정한다 - 채널 최신을 따르면
      # 로컬에서 통과한 커밋이 CI 에서 다른 SDK 로 검증되는 어긋남이 생긴다.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - run: flutter pub get

      # 포맷도 lint 와 같은 정적 검사다 - 로컬에만 두면 정렬이 다시 어긋난다(frontend.yml 과 같은 판단).
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      # 배포 산출물과 같은 형태(wasm)로 빌드가 깨지지 않는지까지 확인한다.
      - run: flutter build web --wasm
