# portfolio_jquery_spring (Spring Boot / Gradle) 파이프라인.
# 프론트엔드와 독립된 워크플로라, 한쪽 서브트리 변경이 다른 쪽 CI 를 돌리지 않는다.
name: backend

on:
  push:
    branches: ['**']
    paths:
      - 'portfolio_jquery_spring/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'portfolio_jquery_spring/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio_jquery_spring

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 빌드 대상 소스는 Java 21(build.gradle sourceCompatibility)이다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 래퍼/의존성 캐시를 붙인다. 래퍼 버전(9.6.1)은 저장소가 고정한다.
      - uses: gradle/actions/setup-gradle@v4

      # useJUnitPlatform 로 서비스/컨트롤러/동시성/파일검증 테스트를 돈다(H2, Docker 불필요).
      # OpenAPI 스냅샷 게이트(OpenApiSnapshotTest)도 이 태스크에 포함된다 - 컨트롤러 시그니처가
      # 바뀌면 커밋된 스펙과 달라져 여기서 실패한다(의도한 변경이면 스냅샷을 갱신해 커밋).
      # 프론트엔드(webpack) 번들은 커밋되어 있어 이 단계는 Node 툴체인을 건드리지 않는다.
      - run: ./gradlew test --no-daemon

      # 스냅샷이 어긋나 실패했을 때 실제 스펙을 받아 볼 수 있게 남긴다.
      # 로그의 "다르다"만 보고 로컬에서 재현하는 대신 CI 산출물로 diff 를 뜰 수 있다.
      # 입력값 보간이 없으므로(정적 경로 + if: failure()) 워크플로 인젝션 표면이 아니다.
      - name: OpenAPI actual spec on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-actual
          path: portfolio_jquery_spring/build/openapi-actual.json
          if-no-files-found: ignore

      # 통합 테스트(Testcontainers, 실제 MySQL 8). GitHub 러너에 Docker 가 있어 그대로 돈다.
      # 기본 test 와 태그로 분리돼 있어(@Tag integration) 로컬 클론은 Docker 없이도 test 가 통과한다.
      - run: ./gradlew integrationTest --no-daemon

      # 실패한 테스트의 **이름과 스택**을 남긴다. 콘솔 로그에는 컨테이너를 내린 뒤의 커넥션
      # 오류가 수백 줄 쏟아져 정작 어느 테스트가 왜 깨졌는지가 묻힌다(실제로 그래서 원인을
      # 못 짚었다). Docker 가 필요한 태스크라 로컬 재현도 쉽지 않으니, 판정 근거는 CI 가
      # 파일로 남겨야 한다. test-results 의 XML 이 실패 메시지를 그대로 담는다.
      # 정적 경로 + if: failure() 라 입력값 보간이 없다.
      - name: integrationTest report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: |
            portfolio_jquery_spring/build/reports/tests/integrationTest
            portfolio_jquery_spring/build/test-results/integrationTest
          if-no-files-found: ignore
