# portfolio_jquery_spring (Spring Boot / Gradle) 파이프라인.
# 프론트엔드와 독립된 워크플로라, 한쪽 서브트리 변경이 다른 쪽 CI 를 돌리지 않는다.
name: backend

on:
  push:
    branches: ['**']
    paths:
      - 'portfolio_jquery_spring/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'portfolio_jquery_spring/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio_jquery_spring

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 빌드 대상 소스는 Java 21(build.gradle sourceCompatibility)이다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 래퍼/의존성 캐시를 붙인다. 래퍼 버전(9.6.1)은 저장소가 고정한다.
      - uses: gradle/actions/setup-gradle@v4

      # useJUnitPlatform 로 서비스/컨트롤러/동시성/파일검증 테스트를 돈다(H2, Docker 불필요).
      # 프론트엔드(webpack) 번들은 커밋되어 있어 이 단계는 Node 툴체인을 건드리지 않는다.
      - run: ./gradlew test --no-daemon

      # 통합 테스트(Testcontainers, 실제 MySQL 8). GitHub 러너에 Docker 가 있어 그대로 돈다.
      # 기본 test 와 태그로 분리돼 있어(@Tag integration) 로컬 클론은 Docker 없이도 test 가 통과한다.
      - run: ./gradlew integrationTest --no-daemon
