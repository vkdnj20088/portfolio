# kind 클러스터 - 로컬과 CI 가 같은 파일을 쓴다.
#
# 노드를 셋 둔 이유: 워커 파드 둘이 **다른 노드에** 뜨는 것을 보려는 것이다. 단일 노드에서는
# replicas=2 가 같은 커널·같은 파일시스템 위에 뜨므로 "진짜 두 프로세스"라는 말이 반만 참이다.
# 그래도 여전히 같은 물리 머신 안이라는 한계는 남는다 - README 에 적었다.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: portfolio
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # NodePort 로 꺼내 쓰려고 ingress 라벨을 붙여 둔다(ingress 컨트롤러는 아직 안 쓴다).
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # 호스트에서 바로 두드릴 수 있게 NodePort 두 개만 연다.
      - containerPort: 30080   # guard (Spring)
        hostPort: 30080
        protocol: TCP
      - containerPort: 30800   # loandoc (FastAPI)
        hostPort: 30800
        protocol: TCP
  - role: worker
  - role: worker
